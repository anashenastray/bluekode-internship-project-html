<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 1rem;
    }

    .calculator-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #38bdf8;
    }

    .operators {
      display: flex;
      flex-direction:row;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .op-btn {
      padding: 12px 0;
      font-size: 1.25rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      min-width: 43px;
    }

    .op-btn:hover {
      background: #7dd3fc;
    }

    .result-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      word-break: break-all;
    }

    .result-label {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .result-text {
      font-weight: 700;
      color: #38bdf8;
      font-size: 1.1rem;
    }
    .hi{
        align-self: center;
    }
  </style>
  <script src="blank.js" defer></script>
</head>
<body>

  <div class="calculator-card">
    <h2 class="title">Calculator</h2>
    <form>
    <div class="input-group">
      <input type="number" id="firstnum" placeholder="Enter first number">
      <input type="number" id="secondnum" placeholder="Enter second number">
    </div>

    <div class="operators">
      <button type="button" class="op-btn" id="addbtn">+</button>
      <button type="button" class="op-btn" id="subbtn">−</button>
      <button type="button" class="op-btn" id="mulbtn">×</button>
      <button type="button" class="op-btn" id="divbtn">÷</button>
      <button type="reset" class="op-btn hi" id="resetbtn">Reset</button>
      <button type="button" class="op-btn" id="sqbtn">X^Y</button>
      <button type="button" class="op-btn" id="rtbtn">X^(1/Y)</button>
      <button type="button" class="op-btn" id="pibtn">Pi</button>
      <button type="button" class="op-btn" id="ebtn">e</button>
    </div>

    <div class="result-box">
      <span class="result-label">Result:</span>
      <span id="resultoutput" class="result-text"></span>
    </div>
    </form>
  </div>

  <script>
    
  </script>
</body>
</html>
